# Every push to main and every pull request runs the same full check as locally (scripts/check.sh):
# decision notes, migrations, backend tests (module dependency rules included), frontend tests, typecheck, build.
# Not here: the equipment model check (TLA+, .claude/skills/verify-equipment-tla) and the browser checks (verify-lab).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml checks the tagged commit with this before building images

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lab
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1" # as in local development (.env.example); tests need no real secret key
      POSTGRES_PASSWORD: lab-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: bash scripts/check.sh
