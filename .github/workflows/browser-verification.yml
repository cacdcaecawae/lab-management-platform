# Synthetic verification only; deliberately scoped to the reviewed browser pilot PR branch.
name: Synthetic browser verification

on:
  pull_request:
    paths:
      - ".github/workflows/browser-verification.yml"
      - ".claude/skills/verify-lab/scripts/browser/**"

permissions:
  contents: read

jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/browser-experiments-reports'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [experiments, reports, login, members]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lab_verify
          POSTGRES_USER: lab_verify
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab_verify -d lab_verify"
          --health-interval 2s
          --health-retries 15
    env:
      POSTGRES_DB: lab_verify
      POSTGRES_USER: lab_verify
      POSTGRES_PASSWORD: synthetic-ci-only
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      TZ: Asia/Shanghai
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: synthetic-browser-verification-only
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5273
      VITE_BACKEND: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: pip install -r backend/requirements.txt 'selenium==4.39.0'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: bash .claude/skills/verify-lab/scripts/browser/run.sh "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
          BROWSER_EVIDENCE: ${{ runner.temp }}/lab-browser-evidence
          DATA_ROOT: ${{ runner.temp }}/lab-browser-data
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-browser-${{ matrix.scenario }}
          path: ${{ runner.temp }}/lab-browser-evidence
          retention-days: 3
          if-no-files-found: ignore
