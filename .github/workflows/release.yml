# Pushing a tag vX.Y.Z releases that commit: the full check runs on it first, then the backend and web images are
# built from the same commit and pushed to ghcr.io/<owner>/<repo>/{backend,web}:vX.Y.Z, and a GitHub release with
# generated notes is created (系统管理 → 版本 compares against it; scripts/update.sh installs it).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      packages: write # the images
    env:
      IMAGE: ghcr.io/${{ github.repository }} # an all-lowercase repository name; ghcr.io rejects uppercase
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}/backend:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}/web:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
