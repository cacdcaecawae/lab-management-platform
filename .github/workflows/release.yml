# Pushing a tag vX.Y.Z releases that commit: the full check runs on it first, then the backend and web images are
# built from the same commit and pushed to ghcr.io/<owner>/<repo>/{backend,web}:vX.Y.Z, and a GitHub release with
# generated notes is created (系统管理 → 版本 compares against it; scripts/update.sh installs it).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      packages: write # the images
    env:
      IMAGE: ghcr.io/${{ github.repository }} # an all-lowercase repository name; ghcr.io rejects uppercase
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}/backend:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}/web:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # --notes goes above the generated list of merged PRs
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            **新安装**：`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash`（README"一键安装"）

            **从旧版本升级**：在"系统管理 → 版本"点"立即更新"，或在安装目录运行 `bash scripts/update.sh ${{ github.ref_name }}`。会先停站备份；新版本起不来时，没改数据库结构的自动退回，改过的停站等运维处理（README"服务器部署"）。v0.1.3 及更早装的站点没有"立即更新"，用命令更新后在安装目录运行一次 `bash scripts/update-agent.sh --install`。

            升级前看一遍下面合并的 PR；改了部署、配置或需要手动操作的，以对应 PR 的说明为准。
