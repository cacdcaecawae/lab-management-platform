# Default: private HTTP on the school network or VPN. HTTPS is explicitly opt-in.
# Coarse per-IP cap; Django enforces the account limit.
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    include /etc/nginx/lab/health.inc;
    include /etc/nginx/lab/site.inc;
}

# 系统后台: Compose publishes this port on the host's 127.0.0.1 only.
server {
    listen 8081;
    server_name _;
    include /etc/nginx/lab/admin.inc;
}
