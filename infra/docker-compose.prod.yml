# Production-style stack: PostgreSQL + Django/Gunicorn + Nginx (serves the Vue build).
# Usage (from repo root):  docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
# Required in .env: DJANGO_SECRET_KEY, DJANGO_DEBUG=0, DJANGO_ALLOWED_HOSTS, POSTGRES_PASSWORD.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # Secure cookies need HTTPS. nginx.conf is HTTP-only until a certificate is configured: an HTTP-only
      # trial must set DJANGO_SECURE_COOKIES=0 and stay inside the school network / VPN.
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-1}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DATA_ROOT: /data/files
      FILE_UPLOAD_TEMP_DIR: /data/tmp
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2147483648}
      # Mail (SMTP) is set by the ops account in the web UI, 系统管理 → 邮件, and stored in the database.
    volumes:
      - labdata:/data           # uploaded research files — back this up
      - static:/app/var/static
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static:/srv/static:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  labdata:
  static:
