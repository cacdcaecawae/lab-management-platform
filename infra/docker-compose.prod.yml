# Production stack: PostgreSQL + Django/Gunicorn + Nginx (serves the Vue build). See README "服务器部署".
# Server: APP_VERSION in .env picks the release images (ghcr.io), `up -d` pulls them; scripts/update.sh changes it.
# Without APP_VERSION the images are "local" and `up -d --build` builds them from this checkout (scripts/trial.ps1).
# .env template: infra/server.env.example.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/cacdcaecawae/lab-management-platform}/backend:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # Secure cookies need HTTPS. nginx.conf is HTTP-only until a certificate is configured: an HTTP-only
      # trial must set DJANGO_SECURE_COOKIES=0 and stay inside the school network / VPN.
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-1}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DATA_ROOT: /data/files
      FILE_UPLOAD_TEMP_DIR: /data/tmp
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2147483648}
      # Mail (SMTP) is set by the ops account in the web UI, 系统管理 → 邮件, and stored in the database.
    volumes:
      - labdata:/data           # uploaded research files — back this up
      - static:/app/var/static
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/cacdcaecawae/lab-management-platform}/web:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static:/srv/static:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Backups only (scripts/backup.sh, restore.sh, update.sh): restic in a container, so the server needs only Docker.
  restic:
    image: restic/restic:0.19.1
    profiles: [ops]
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:-}
    volumes:
      - labdata:/data
      - type: bind
        source: ${BACKUP_REPO:-./backup-repo-not-set}
        target: /repo
        bind:
          create_host_path: false

volumes:
  pgdata:
  labdata:
  static:
