# Bootstrap only: combine with docker-compose.prod.yml BEFORE the first certificate exists.
# Run "up -d --no-deps web" to serve only the HTTP-01 challenge (other paths return 503).
services:
  web:
    volumes:
      - type: bind
        source: "./nginx.acme.conf"
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "./nginx.acme.inc"
        target: /etc/nginx/lab/acme.inc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ACME_WEBROOT:-/srv/lab-certbot/www}"
        target: /srv/certbot/www
        read_only: true
        bind:
          create_host_path: false
